# One image, four roles sharing the "data" volume. Only "controller" may talk to the printers' heaters,
# and there must only ever be ONE controller container.
x-app: &app
  build: .
  image: bambu-filament-controller:local
  restart: unless-stopped
  env_file: .env
  volumes:
    - data:/data

services:
  web:
    <<: *app
    command: web
    ports:
      - "${BFC_PORT:-8092}:8092"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/login', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  controller:
    <<: *app
    command: controller
    stop_grace_period: 30s
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "flask", "controller-alive"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3

  camera:
    <<: *app
    command: camera
    depends_on:
      web:
        condition: service_healthy

  watchdog:
    <<: *app
    command: watchdog
    depends_on:
      web:
        condition: service_healthy

volumes:
  data:
